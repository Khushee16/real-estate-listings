<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All Listings — Haven Homes</title>
<meta name="description" content="Search fictional Haven Homes listings by keyword, type, price and bedrooms.">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
  <div class="container">
    <a class="navbar-brand brand" href="index.html">Haven <span>Homes</span></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link active" href="listings.html">Listings</a></li>
      </ul>
    </div>
  </div>
</nav>

<section class="section">
  <div class="container">
    <div class="mb-4 reveal"><p class="eyebrow">All listings</p><h2>Search homes</h2></div>
    <div id="demo-note"></div>
    <div class="card p-3 p-md-4 mb-4 reveal" style="border:none;box-shadow:0 8px 30px rgba(20,39,61,.08)">
      <div class="row g-3">
        <div class="col-md-4"><label class="form-label" for="q">Keyword</label><input id="q" class="form-control" type="search" placeholder="City, street or home name…"></div>
        <div class="col-6 col-md-2"><label class="form-label" for="type">Type</label><select id="type" class="form-select"><option value="">Any type</option><option>House</option><option>Condo</option><option>Townhouse</option><option>Apartment</option></select></div>
        <div class="col-6 col-md-2"><label class="form-label" for="max-price">Max price</label><select id="max-price" class="form-select"><option value="">No max</option><option value="250000">$250,000</option><option value="400000">$400,000</option><option value="500000">$500,000</option><option value="700000">$700,000</option></select></div>
        <div class="col-6 col-md-2"><label class="form-label" for="min-beds">Min bedrooms</label><select id="min-beds" class="form-select"><option value="">Any</option><option value="1">1+</option><option value="2">2+</option><option value="3">3+</option><option value="4">4+</option><option value="5">5+</option></select></div>
        <div class="col-6 col-md-2"><label class="form-label" for="sort">Sort by</label><select id="sort" class="form-select"><option value="">Featured</option><option value="price-asc">Price: low → high</option><option value="price-desc">Price: high → low</option><option value="beds-desc">Most bedrooms</option><option value="sqft-desc">Largest</option></select></div>
      </div>
      <div class="d-flex justify-content-between align-items-center mt-3">
        <span id="result-count" class="text-muted small"></span>
        <button id="clear-filters" class="btn btn-sm btn-outline-navy">Clear filters</button>
      </div>
    </div>
    <div class="row g-4" id="listings-grid"><div class="col-12"><p class="text-muted">Loading homes…</p></div></div>
  </div>
</section>

<footer class="py-5">
  <div class="container d-flex flex-column flex-md-row justify-content-between gap-3">
    <div><strong class="serif fs-5">Haven Homes</strong><p class="mb-0 small mt-2">A fictional demo agency built as a self-directed portfolio piece.</p></div>
    <div class="small"><a href="index.html" class="d-block mb-1">Home</a><a href="listings.html" class="d-block">Listings</a></div>
  </div>
  <div class="container small mt-4 opacity-75">© <span id="year">2026</span> Haven Homes (demo). Photos: picsum.photos.</div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
